{% extends 'base.html' %}

{% block title %}Confirm Delete Supplier{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-custom p-4 text-center">
            <i class="fas fa-exclamation-triangle text-danger display-3 mb-3"></i>
            <h4 class="fw-bold">Delete Supplier Profile?</h4>
            <p class="text-muted">Are you sure you want to delete supplier <strong>{{ object.name }} ({{ object.code }})</strong>?</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'suppliers:supplier_list' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger fw-bold px-4">Delete Supplier</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
