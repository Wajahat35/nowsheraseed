{% load humanize %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barcode Label - {{ seed.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff; color: #000; }
        .barcode-box { max-width: 400px; margin: 30px auto; padding: 20px; border: 2px dashed #333; text-align: center; }
        @media print { .btn-print { display: none; } }
    </style>
</head>
<body onload="window.print()">
    <div class="text-center my-3 btn-print">
        <button onclick="window.print()" class="btn btn-primary">Print Barcode Label</button>
    </div>

    <div class="barcode-box">
        <h5 class="fw-bold mb-0">{{ seed.name }}</h5>
        <div class="small text-muted">{{ seed.variety }} ({{ seed.packing_size }})</div>
        <div class="fw-bold fs-5 text-success my-2">PKR {{ seed.retail_price|intcomma }}</div>
        
        <div class="my-2">
            <img src="{{ seed.get_qr_data_uri }}" width="130" height="130" style="display:inline-block; border: 1px solid #dee2e6; border-radius: 6px; padding: 4px;" alt="Seed QR Code">
            <div class="small text-muted mt-1" style="font-size: 0.75rem;">Scan QR Code to Verify Seed Online</div>
        </div>
        <div class="font-monospace fw-bold fs-6">{{ seed.barcode }}</div>
        <div class="small text-muted">{{ company.name|default:"Enterprise Seed ERP" }}</div>
    </div>
</body>
</html>
