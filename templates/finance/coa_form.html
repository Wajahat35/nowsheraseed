{% extends 'base.html' %}

{% block title %}Add Chart of Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-custom p-4">
            <h4 class="fw-bold mb-3">
                <i class="fas fa-university text-primary me-2"></i> Add Account to Chart of Accounts
            </h4>
            
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Account Code *</label>
                        {{ form.code }}
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Account Title / Name *</label>
                        {{ form.name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Account Category *</label>
                        {{ form.category }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Status</label>
                        <div class="form-check mt-2">
                            {{ form.is_active }}
                            <label class="form-check-label">Active Account</label>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Account Description</label>
                        {{ form.description }}
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'finance:coa_list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">
                        Save Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
