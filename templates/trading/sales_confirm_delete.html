{% extends 'trading/base_trading.html' %}

{% block title %}Delete Sales Invoice{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3 p-4 bg-white text-center">
            <i class="fas fa-exclamation-triangle text-danger fs-1 mb-3"></i>
            <h4 class="fw-bold mb-2">Delete Seed Sales Invoice?</h4>
            <p class="text-muted">Are you sure you want to delete sales invoice <strong>{{ object.invoice_number }}</strong> (Customer: {{ object.customer_name }})?</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'trading:sales_list' %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger fw-bold px-4"><i class="fas fa-trash me-1"></i> Delete Invoice</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
