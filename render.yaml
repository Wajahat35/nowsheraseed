# render.yaml — Render Infrastructure-as-Code for Noshera Seeds ERP
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: nowsheraseed
    runtime: python
    region: oregon         # Free tier region (us-west-2)
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn seed_erp.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: seed_erp.settings
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.14.2"
      - key: SECRET_KEY
        generateValue: true     # Render generates a secure random value automatically
      - key: ALLOWED_HOSTS
        value: "nowsheraseed.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nowsheraseed-db
          property: connectionString

databases:
  - name: nowsheraseed-db
    databaseName: nowsheraseed
    user: nowsheraseed
    plan: free
    region: oregon
